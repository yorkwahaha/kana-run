<script>
// ── 網頁版音訊解鎖 ──────────────────────────────────────────────────────
// 為什麼需要這個：
//   瀏覽器禁止網頁在沒有使用者手勢時發聲。Godot 的 AudioContext 初始是
//   suspended，必須在使用者點過畫面之後 resume()。
//
//   Godot 4.7 把 AudioContext 放在 index.js 的 module scope
//   （`var GodotAudio = { ctx: AudioContext, ... }`），沒有掛到 window。
//   GDScript 的 JavaScriptBridge 因此拿不到它；
//   而 _godot_audio_resume 是 Emscripten 的 wasm import 函式，
//   只存在於 wasmImports 物件裡給 wasm 呼叫，外部同樣拿不到。
//
//   結論：唯一能攔到引擎建立的 AudioContext 的地方，是這支在
//   index.js **之前** 執行的 script。我們用 Proxy 包一層
//   window.AudioContext，每當引擎 new 一個就把它記下來，
//   之後每次使用者輸入就把記下來的那一個 context resume()。
//   解鎖是每個 AudioContext 自己的事，另開一個 context 不會讓 Godot 的出聲。
(function () {
  const OrigAC = window.AudioContext || window.webkitAudioContext;
  if (!OrigAC) return;

  const contexts = new Set();

  // 用 Proxy 而不是 prototype getter：
  // getter 寫在 prototype 上時拿不到建構式的區域變數（ctx 不在 scope），
  // 而 Proxy 的 get/set 陷阱就在同一個閉包裡，ctx 一定看得到。
  function makeTracked(Ctor) {
    return new Proxy(Ctor, {
      construct(target, args, newTarget) {
        const ctx = Reflect.construct(target, args, newTarget);
        contexts.add(ctx);
        // 狀態變化時自動再 resume 一次。
        // iOS Safari 切分頁會把 ctx 變成 'interrupted'，這裡能撈回來。
        if (ctx.onstatechange === null) {
          ctx.addEventListener('statechange', function () {
            if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
              try { ctx.resume(); } catch (e) {}
            }
          });
        }
        return ctx;
      },
      get(target, prop, recv) {
        if (prop === '__kanaTracked' || prop === '__kanaOriginal') return target;
        const v = Reflect.get(target, prop, recv);
        return typeof v === 'function' ? v.bind(target) : v;
      },
    });
  }

  try {
    Object.defineProperty(window, 'AudioContext', {
      value: makeTracked(OrigAC), configurable: true, writable: true,
    });
    if (window.webkitAudioContext) {
      Object.defineProperty(window, 'webkitAudioContext', {
        value: makeTracked(window.webkitAudioContext), configurable: true, writable: true,
      });
    }
  } catch (e) {}

  // 只 resume 引擎已經建立的 context。
  // 先前 n===0 時會 new 一個無聲的 AudioContext 當保險，
  // 但那些 context 一建立就是 running，下一輪 n 還是 0，
  // 計時器 20 次加每次點擊就再長一個，主控台看到 tracked 漲到 29。
  function resumeAll() {
    var n = 0;
    for (const c of contexts) {
      if (c.state === 'closed') {
        contexts.delete(c);
        continue;
      }
      if (c.state !== 'suspended' && c.state !== 'interrupted') continue;
      try { c.resume(); n++; } catch (e) {}
    }
    if (n && window.console) {
      console.log('[audio-unlock] resumed ' + n + ' of ' + contexts.size);
    }
  }

  for (const ev of ['pointerdown', 'touchstart', 'keydown', 'mousedown', 'click']) {
    window.addEventListener(ev, resumeAll, { passive: true, capture: true });
  }
  // iOS Safari 切回前景時 ctx 會變 interrupted，這裡撈回來
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) setTimeout(resumeAll, 60);
  });
  // 引擎啟動要時間，前幾秒多試幾次，涵蓋「使用者比引擎早點完」
  for (let i = 0; i < 20; i++) setTimeout(resumeAll, 200 + i * 250);

  window.__kanaAudioUnlock = resumeAll;
})();
</script>
