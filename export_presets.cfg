[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
# all_resources 只打包被場景參照到的資源。
# 本專案的音訊與字型是執行期用字串路徑動態載入的，沒有任何場景引用，
# 所以線上版曾整個漏掉 6.4MB 音訊，而且匯出「成功」、沒有任何錯誤。
#
# 解法是 AssetManifest：audio_manifest.gd 用 preload 把音訊與字型
# 拉進資源依賴圖，all_resources 就會把它們一起打包。
# 不要在這裡加舊版的 include_filter 鍵，Godot 4.7 已移除它。
export_filter="all_resources"
exclude_filter="build/*, shots/*, tools/*, *.md"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
# thread_support MUST stay false for GitHub Pages.
#
# Two independent reasons, both of which we cannot work around:
#
#  1. Secure context. Browsers only treat https:// and http://localhost as
#     secure context. Godot 4.7 checks this unconditionally -- the check sits
#     OUTSIDE the `if (supportsThreads)` block in index.js, so a
#     single-threaded build needs it too. GitHub Pages is https, so this one
#     is satisfied.
#
#  2. Cross-origin isolation. Threads need SharedArrayBuffer, which only
#     exists in a cross-origin-isolated page (COOP: same-origin +
#     COEP: require-corp). GitHub Pages serves static files and offers NO
#     way to set response headers, so isolation is unreachable there.
#     Result: SharedArrayBuffer is never granted and a threaded build dies
#     at startup with "Cross-Origin Isolation / SharedArrayBuffer missing".
#
# So: false for Pages. Turning it on requires a host that can set headers
# (Cloudflare Pages, Netlify, itch.io with custom headers) -- not GitHub Pages.
variant/thread_support=false
vram_texture_compression/for_desktop=true
# Web 平臺不支援 VRAM 紋理壓縮（S3TC/ETC）。開著會讓 --export-release "Web"
# 直接失敗，而且 Godot 4.7 只印「configuration errors:」後面接空白，
# 診斷訊息是空的 —— 很容易誤判成 template 沒裝或 preset 壞掉。
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
# 保持關閉。跨來源隔離標頭要靠伺服器送，preset 只是產生一個 meta 標籤，
# 而 GitHub Pages 不允許自訂 HTTP 標頭。開著沒有任何作用，只會造成誤解。
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.043, 0.031, 0.078, 1)

