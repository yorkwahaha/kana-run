name: Deploy Web

# 每次 push 到 main 就重新匯出 Web 並發佈到 GitHub Pages。
# 這樣網頁版永遠跟著 main 一致，不必在本機手動跑 export-web.bat 再上傳。

on:
  push:
    branches: [main]
  workflow_dispatch:      # 可以在 Actions 頁面手動重跑，不必假造一個 commit

permissions:
  contents: read
  pages: write
  id-token: write          # Pages 部署需要這個才能拿到部署憑證

# 同時只能跑一個部署，否則兩個 push 會互相搶快取。
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Godot 執行期與匯出範本是兩個不同的檔案，都要抓。
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # 匯出範本約 1.2GB，每次重抓太慢，用 actions/cache 快取。
      # key 綁版本號 + 解壓結構版本：改了解壓方式時把 v2 往上加，
      # 否則舊的錯誤結構會被 cache 沿用，匯出還是失敗但看不出原因。
      - name: Cache export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-v3

      # .tpz 裡的 version.txt 內容是 "4.7.2.stable"（點），
      # 但下載檔名是 "4.7.2-stable"（減號）。Godot 是拿 version.txt 的
      # 內容去比對資料夾名稱，不符就把整個目錄視為無效，於是報
      # "No export template found at the expected path:"。
      #
      # 那行訊息後面的路徑在 Actions 日誌裡會被截斷成空白，
      # 看起來像「完全沒下載」，實際上檔案都在、只是資料夾名稱不對。
      # 所以資料夾名稱必須從 version.txt 讀出來，不能用變數拼。
      - name: Download export templates (cache miss)
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "downloaded $(du -h templates.tpz | cut -f1)"

          # 先解到暫存目錄，用 version.txt 的內容當資料夾名。
          rm -rf tpl_stage
          mkdir -p tpl_stage
          unzip -q -j templates.tpz 'templates/*' -d tpl_stage
          # version.txt 內容形如 "4.7.2.stable"，正是 Godot 期望的目錄名。
          VER_NAME="$(cat tpl_stage/version.txt)"
          echo "version.txt says: $VER_NAME"

          DEST="$HOME/.local/share/godot/export_templates/$VER_NAME"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          mv tpl_stage/* "$DEST"/

          echo "--- installed to $DEST ---"
          ls "$DEST" | head -40
          test -f "$DEST/web_nothreads_release.zip" \
            || { echo "web_nothreads_release.zip 不在包裡，匯出一定失敗"; exit 1; }

      # 第一次 checkout 之後 .godot/ 是空的，資源還沒匯入。
      # 不先 --import 直接匯出會得到一個沒有任何材質的 pck。
      - name: Import resources
        run: |
          godot --headless --path . --import 2>&1 | tail -5
          # 匯入在無音效輸出的 headless 環境下可能「看起來成功」但其實沒產出。
          # 逐一檢查關鍵資產，缺任何一個就明確失敗，不要讓它靜靜流到部署。
          missing=0
          for f in .godot/imported/*.oggvorbisstr; do
            [ -e "$f" ] || { echo "沒有匯入任何 ogg 音訊"; missing=1; }
            break
          done
          ls .godot/imported/*.mp3str >/dev/null 2>&1 || { echo "沒有匯入任何 mp3 語音"; missing=1; }
          ls .godot/imported/*.ttf >/dev/null 2>&1 || { echo "沒有匯入字型"; missing=1; }
          echo "imported oggvorbisstr: $(ls .godot/imported/*.oggvorbisstr 2>/dev/null | wc -l)"
          echo "imported mp3str      : $(ls .godot/imported/*.mp3str 2>/dev/null | wc -l)"
          echo "imported ttf        : $(ls .godot/imported/*.ttf 2>/dev/null | wc -l)"
          exit $missing

      - name: Export web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          echo "templates:"; ls ~/.local/share/godot/export_templates/*/ 2>/dev/null | head -5
          # pck 大小是「有沒有真的把資源打進去」最可靠的指標。
          # 13MB 左右表示音訊字型都在；7MB 表示匯入步驟沒生效，
          # 遊戲會安靜地退回程序化音效而不報任何錯。
          size=$(stat -c%s build/web/index.pck)
          echo "pck size: $((size / 1048576)) MB"
          if [ "$size" -lt 10000000 ]; then
            echo "pck 只有 $((size / 1048576)) MB，資源沒有完整匯入"
            exit 1
          fi

      - name: Verify output
        run: |
          test -f build/web/index.html
          test -f build/web/index.pck
          test -f build/web/index.wasm
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
