<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0818"/>
      <stop offset="1" stop-color="#2a1a48"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2740"/>
      <stop offset="0.55" stop-color="#15131f"/>
      <stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7cff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8f9bff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#sky)"/>
  <circle cx="96" cy="26" r="9" fill="#fff6e0" opacity="0.85" filter="url(#glow)"/>

  <!-- 跑道透視 -->
  <path d="M52 128 L64 74 L76 128 Z" fill="#1a1626"/>
  <path d="M50 128 L63 76 L65 76 L54 128 Z" fill="url(#rail)"/>
  <path d="M78 128 L65 76 L67 76 L76 128 Z" fill="url(#rail)"/>

  <!-- 石碑 -->
  <rect x="42" y="26" width="44" height="72" rx="4" fill="url(#stone)"/>
  <rect x="38" y="20" width="52" height="9" rx="3" fill="#221f33"/>
  <rect x="36" y="96" width="56" height="10" rx="3" fill="#221f33"/>
  <rect x="46" y="32" width="36" height="60" rx="2" fill="none"
        stroke="#5f6cff" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- 碑面假名「あ」 -->
  <text x="64" y="76" font-family="'Zen Kaku Gothic New','Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"
        font-size="44" font-weight="900" text-anchor="middle" fill="#ffe9bd"
        filter="url(#glow)">あ</text>
</svg>
