name: Deploy Web

# 每次 push 到 main 就重新匯出 Web 並發佈到 GitHub Pages。
# 這樣網頁版永遠跟著 main 一致，不必在本機手動跑 export-web.bat 再上傳。

on:
  push:
    branches: [main]
  workflow_dispatch:      # 可以在 Actions 頁面手動重跑，不必假造一個 commit

permissions:
  contents: read
  pages: write
  id-token: write          # Pages 部署需要這個才能拿到部署憑證

# 同時只能跑一個部署，否則兩個 push 會互相搶快取。
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Godot 執行期與匯出範本是兩個不同的檔案，都要抓。
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # 匯出範本約 1.2GB，每次重抓太慢，用 actions/cache 快取。
      # key 綁版本號 + 解壓結構版本：改了解壓方式時把 v2 往上加，
      # 否則舊的錯誤結構會被 cache 沿用，匯出還是失敗但看不出原因。
      - name: Cache export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-v3

      # .tpz 裡的 version.txt 內容是 "4.7.2.stable"（點），
      # 但下載檔名是 "4.7.2-stable"（減號）。Godot 是拿 version.txt 的
      # 內容去比對資料夾名稱，不符就把整個目錄視為無效，於是報
      # "No export template found at the expected path:"。
      #
      # 那行訊息後面的路徑在 Actions 日誌裡會被截斷成空白，
      # 看起來像「完全沒下載」，實際上檔案都在、只是資料夾名稱不對。
      # 所以資料夾名稱必須從 version.txt 讀出來，不能用變數拼。
      - name: Download export templates (cache miss)
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          echo "downloaded $(du -h templates.tpz | cut -f1)"

          # 先解到暫存目錄，用 version.txt 的內容當資料夾名。
          rm -rf tpl_stage
          mkdir -p tpl_stage
          unzip -q -j templates.tpz 'templates/*' -d tpl_stage
          # version.txt 內容形如 "4.7.2.stable"，正是 Godot 期望的目錄名。
          VER_NAME="$(cat tpl_stage/version.txt)"
          echo "version.txt says: $VER_NAME"

          DEST="$HOME/.local/share/godot/export_templates/$VER_NAME"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          mv tpl_stage/* "$DEST"/

          echo "--- installed to $DEST ---"
          ls "$DEST" | head -40
          test -f "$DEST/web_nothreads_release.zip" \
            || { echo "web_nothreads_release.zip 不在包裡，匯出一定失敗"; exit 1; }

      # 第一次 checkout 之後 .godot/ 是空的，資源還沒匯入。
      # 不先 --import 直接匯出會得到一個沒有任何材質的 pck。
      #
      # 匯入的副檔名跟來源檔不同，要照 Godot 的命名規則檢查：
      #   .ogg      -> .oggvorbisstr
      #   .mp3      -> .mp3str
      #   .ttf      -> .fontdata     ← 不是 .ttf
      - name: Import resources
        run: |
          godot --headless --path . --import 2>&1 | tail -3
          missing=0
          # 全部音訊都是 MP3，匯入後的副檔名是 .mp3str。
          # 早期用過 Ogg Vorbis（.oggvorbisstr），但 iOS Safari 18.4 以下不支援，
          # 症狀是「音效有聲音、BGM 靜默」而沒有任何錯誤訊息。
          for pat in "*.mp3str" "*.fontdata"; do
            n=$(ls .godot/imported/$pat 2>/dev/null | wc -l)
            echo "imported $pat: $n"
            if [ "$n" -eq 0 ]; then
              echo "★ 沒有匯入任何 $pat"
              missing=1
            fi
          done
          # 順便擋住 Ogg 混入：未來有人（或 AI）再壓成 Ogg 會直接讓 iPad 沒聲音
          if ls .godot/imported/*.oggvorbisstr >/dev/null 2>&1; then
            echo "★ 偵測到 Ogg 音訊，iOS Safari 可能無法播放。請改用 MP3。"
            missing=1
          fi
          exit $missing

      - name: Export web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          echo "templates:"; ls ~/.local/share/godot/export_templates/*/ 2>/dev/null | head -5
          size=$(stat -c%s build/web/index.pck)
          echo "pck size: $((size / 1048576)) MB"

          # pck 有內部壓縮，13MB 原始音訊進去只會變成 7MB 左右，
          # 所以大小不能當判準。要直接檢查音訊有沒有真的被打包。
          missing=0
          for pat in ".mp3str" ".fontdata"; do
            n=$(grep -c -- "$pat" build/web/index.pck 2>/dev/null || true)
            n=${n:-0}
            echo "pck contains $pat: $n"
            if [ "$n" -lt 1 ]; then
              echo "★ pck 裡沒有 $pat，音訊／字型沒被打包"
              missing=1
            fi
          done
          if grep -q -- ".oggvorbisstr" build/web/index.pck 2>/dev/null; then
            echo "★ pck 裡有 Ogg 音訊，iOS Safari 可能無法播放"
            missing=1
          fi

          # 最可靠的驗證：實際執行匯出出的 pck，確認遊戲讀得到音訊。
          # 單看檔案在不在不夠 —— 執行期還要能 DirAccess/ResourceLoader 讀到。
          echo "--- running the exported pack ---"
          timeout 90 godot --headless --main-pack build/web/index.pck -- --perfect --turbo=5 2>&1 \
            | grep -E "\[sfx\]" | head -3 | tee /tmp/sfx.log || true
          if ! grep -q "外部 BGM" /tmp/sfx.log; then
            echo "★ 匯出後的遊戲讀不到外部 BGM"
            missing=1
          fi
          exit $missing

      - name: Verify output
        run: |
          test -f build/web/index.html
          test -f build/web/index.pck
          test -f build/web/index.wasm
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
